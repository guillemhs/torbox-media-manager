<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TorBox Media Manager</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/vendor/puppertino/puppertino.min.css?v=3">
    <style>
      :root{font-family:system-ui,-apple-system,sans-serif}body{margin:0;min-height:100vh;background:#f5f5f7;color:#1d1d1f}
      .view{display:none} .view.active{display:block} .hidden{display:none}
      #app-sidebar{position:fixed;top:0;left:0;width:280px;height:100vh;background:#fff;border-right:1px solid #e5e5e5;transform:translateX(-100%);transition:transform .2s;z-index:50;padding:24px}
      #app-sidebar.open{transform:translateX(0)}
      #sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s;z-index:45}
      #sidebar-overlay.visible{opacity:1;pointer-events:auto}
      body.sidebar-open{overflow:hidden}
      .p-sidebar-item{display:block;padding:10px 14px;color:#1d1d1f;text-decoration:none;border-radius:8px}
      .p-sidebar-item.p-selected{background:#f2f2f7;color:#000}
      .p-sidebar-item[aria-current="page"]{background:#f2f2f7;font-weight:600}
      #hamburger-menu{display:none;position:fixed;top:12px;left:12px;z-index:60;background:#fff;border:1px solid #d2d2d7;border-radius:8px;padding:8px;cursor:pointer}
      @media (max-width:760px){#hamburger-menu{display:block}}
      #root{padding-top:60px;padding-bottom:24px}
      .page-title{font-size:20px;font-weight:600;margin:0 0 16px}
      .section{margin-bottom:24px}
      .section-title{font-size:16px;font-weight:600;margin:0 0 12px}
      .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
      .results{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
      .empty-state{padding:40px;text-align:center;color:#86868b}
      .spinner{display:inline-block;width:16px;height:16px;border:2px solid #e5e5e5;border-top-color:#000;border-radius:50%;animation:spin .8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .skeleton{background:#e5e5e5;border-radius:8px;animation:pulse 1.2s infinite}
      @keyframes pulse{0%,100%{opacity:.6}50%{opacity:.3}}
      label{font-size:12px;color:#86868b;margin-right:6px}
    </style>
  </head>
  <body>
    <button id="hamburger-menu" aria-label="Menu" aria-expanded="false">&#9776;</button>
    <div id="sidebar-overlay"></div>
    <nav id="app-sidebar">
      <h3 style="margin:0 0 16px;font-size:18px">TorBox</h3>
      <a href="/browse" class="p-sidebar-item" data-view="browse">Browse</a>
      <a href="/movies" class="p-sidebar-item" data-view="movies">Movies</a>
      <a href="/shows" class="p-sidebar-item" data-view="shows">Shows</a>
      <a href="/torrents" class="p-sidebar-item" data-view="torrents">TorBox Library</a>
      <a href="/local" class="p-sidebar-item" data-view="local">Local Media</a>
      <a href="/music" class="p-sidebar-item" data-view="music">Music</a>
      <a href="/calendar" class="p-sidebar-item" data-view="calendar">Calendar</a>
    </nav>

    <div id="root">
      <h1 id="page-title" class="page-title">TorBox Media Manager</h1>

      <!-- Browse view -->
      <section id="view-browse" class="view">
        <div class="toolbar">
          <label for="browse-query">Search</label>
          <input id="browse-query" type="search" placeholder="Search movies, shows, music…" />
          <label style="display:flex;align-items:center;gap:6px;font-size:13px"><input id="source-indexers" type="checkbox" checked /> Indexers</label>
          <label style="display:flex;align-items:center;gap:6px;font-size:13px"><input id="source-usenet" type="checkbox" /> Usenet</label>
        </div>
        <div id="browse-status"></div>

        <section id="browse-movies-section" class="section">
          <h2 id="browse-movies-title" class="section-title">Movies</h2>
          <div id="browse-movies-results" class="results"></div>
          <button id="browse-movies-more" class="p-button p-button-secondary">More</button>
        </section>

        <section id="browse-shows-section" class="section">
          <h2 id="browse-shows-title" class="section-title">Shows</h2>
          <div id="browse-shows-results" class="results"></div>
          <button id="browse-shows-more" class="p-button p-button-secondary">More</button>
        </section>

        <section id="browse-music-section" class="section">
          <h2 id="browse-music-title" class="section-title">Music</h2>
          <div id="browse-music-results" class="results"></div>
          <button id="browse-music-more" class="p-button p-button-secondary">More</button>
        </section>

        <section id="browse-torrents-section" class="section">
          <h2 id="browse-torrents-title" class="section-title">Torrents</h2>
          <div id="browse-torrents-results" class="results"></div>
          <button id="browse-torrents-more" class="p-button p-button-secondary">More</button>
        </section>

        <section id="browse-usenet-section" class="section">
          <h2 id="browse-usenet-title" class="section-title">Usenet</h2>
          <div id="browse-usenet-results" class="results"></div>
          <button id="browse-usenet-more" class="p-button p-button-secondary">More</button>
        </section>

        <section id="browse-torrent-search-section" class="section hidden">
          <h2 id="browse-torrent-search-title" class="section-title">Torrent Results</h2>
          <div id="browse-torrent-results" class="results"></div>
          <button id="browse-torrent-more" class="p-button p-button-secondary">More</button>
        </section>

        <section id="browse-usenet-search-section" class="section hidden">
          <label style="font-size:13px">Usenet source</label>
          <select id="browse-usenet-search-source"><option value="all">All</option></select>
          <h2 id="browse-usenet-search-title" class="section-title">Usenet Results</h2>
          <div id="browse-usenet-search-results" class="results"></div>
          <button id="browse-usenet-search-more" class="p-button p-button-secondary">More</button>
        </section>
      </section>

      <!-- Movies view -->
      <section id="view-movies" class="view">
        <div class="toolbar">
          <label for="movies-query">Search</label>
          <input id="movies-query" type="search" placeholder="Search movies…" />
        </div>
        <div id="movies-status"></div>
        <div id="movies-count"></div>
        <div id="movies-results" class="results"></div>
        <button id="movies-more" class="p-button p-button-secondary">More</button>
      </section>

      <!-- Shows view -->
      <section id="view-shows" class="view">
        <div class="toolbar">
          <label for="shows-query">Search</label>
          <input id="shows-query" type="search" placeholder="Search shows…" />
        </div>
        <div id="shows-status"></div>
        <div id="shows-count"></div>
        <div id="shows-results" class="results"></div>
        <button id="shows-more" class="p-button p-button-secondary">More</button>
      </section>

      <!-- Torrents view -->
      <section id="view-torrents" class="view">
        <div class="toolbar">
          <label for="library-query">Search library</label>
          <input id="library-query" type="search" placeholder="Search library…" />
          <label for="library-sort">Sort by</label>
          <select id="library-sort"><option value="created">Added</option><option value="name">Name</option><option value="size">Size</option><option value="status">Status</option></select>
          <label for="library-filter">Filter by</label>
          <select id="library-filter"><option value="all">All</option><option value="video">Video</option><option value="music">Music</option><option value="other">Other</option></select>
        </div>
        <div id="library-summary"></div>
        <div id="torrents-results" class="results"></div>
      </section>

      <!-- Local view -->
      <section id="view-local" class="view">
        <div class="toolbar">
          <label for="library-query-local">Search local media</label>
          <input id="library-query-local" type="search" placeholder="Search local media…" />
          <label for="library-sort-local">Sort by</label>
          <select id="library-sort-local"><option value="created">Added</option><option value="name">Name</option></select>
          <label for="library-filter-local">Filter by</label>
          <select id="library-filter-local"><option value="all">All</option><option value="video">Video</option><option value="music">Music</option></select>
        </div>
        <div id="library-summary-local"></div>
        <div id="torrents-results-local" class="results"></div>
      </section>

      <!-- Music view -->
      <section id="view-music" class="view">
        <div class="toolbar">
          <label for="music-query">Search</label>
          <input id="music-query" type="search" placeholder="Search music…" />
        </div>
        <div id="music-status"></div>
        <div id="music-count"></div>
        <div id="music-results" class="results"></div>
        <button id="music-more" class="p-button p-button-secondary">More</button>
      </section>

      <!-- Calendar view -->
      <section id="view-calendar" class="view">
        <div class="toolbar">
          <label for="calendar-date">Date</label>
          <input id="calendar-date" type="date" />
          <label for="calendar-country">Country</label>
          <select id="calendar-country"><option value="US">US</option></select>
          <label for="calendar-source">Source</label>
          <select id="calendar-source"><option value="all">All</option></select>
          <label for="calendar-query">Search</label>
          <input id="calendar-query" type="search" placeholder="Search…" />
          <label for="calendar-platform">Platform</label>
          <select id="calendar-platform"><option value="all">All</option></select>
        </div>
        <div id="calendar-summary"></div>
        <div id="calendar-results" class="results"></div>
      </section>

      <!-- Title view -->
      <section id="view-title" class="view">
        <div id="detail-content"></div>

        <!-- Title search results -->
        <div id="title-search-status"></div>
        <div id="title-search-results"></div>

        <!-- Title torrent search -->
        <div id="title-torrent-search-title"></div>
        <div id="title-torrent-count"></div>
        <div id="title-torrent-results" class="results"></div>
        <button id="title-torrent-more" class="p-button p-button-secondary">More</button>

        <!-- Title usenet search -->
        <div id="title-usenet-search-title"></div>
        <div id="title-usenet-search-count"></div>
        <div id="title-usenet-search-results" class="results"></div>
        <label for="title-usenet-search-source">Source</label>
        <select id="title-usenet-search-source"><option value="all">All</option></select>
        <button id="title-usenet-search-more" class="p-button p-button-secondary">More</button>
      </section>

      <!-- Usenet search -->
      <section id="usenet-search" class="section hidden">
        <div class="toolbar">
          <label for="usenet-query">Search</label>
          <input id="usenet-query" type="search" placeholder="Search Usenet…" />
          <label for="usenet-search-source">Source</label>
          <select id="usenet-search-source"><option value="all">All</option></select>
        </div>
        <div id="usenet-status"></div>
        <div id="usenet-results" class="results"></div>
        <label style="font-size:13px;display:flex;align-items:center;gap:6px"><input id="usenet-cached-only" type="checkbox" /> Cached only</label>
        <div style="font-size:12px;color:#86868b">
          <label for="usenet-offset">Offset</label>
          <input id="usenet-offset" type="number" value="0" style="width:40px" />
          <label for="usenet-limit">Limit</label>
          <input id="usenet-limit" type="number" value="20" style="width:40px" />
        </div>
      </section>

      <!-- Torrents/Usenet search -->
      <section id="torrents-usenet-search" class="section hidden">
        <div id="torrents-usenet-search-title"></div>
        <div id="torrents-usenet-search-count"></div>
        <div id="torrents-usenet-search-results" class="results"></div>
        <label for="torrents-usenet-search-source">Source</label>
        <select id="torrents-usenet-search-source"><option value="all">All</option></select>
        <button id="torrents-usenet-search-more" class="p-button p-button-secondary">More</button>
      </section>

      <!-- Music release -->
      <section id="music-release" class="section hidden">
        <div id="music-release-status"></div>
        <div id="music-release-results" class="results"></div>
      </section>

      <!-- Candidate modal -->
      <div id="candidate-modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px">
        <div style="background:#fff;border-radius:12px;padding:24px;min-width:400px;max-width:600px;max-height:80vh;overflow:auto">
          <h2 id="candidate-title" style="margin-top:0"></h2>
          <div id="candidate-results"></div>
          <div id="candidate-status" style="font-size:12px;color:#86868b"></div>
          <div style="font-size:12px;color:#86868b;margin-top:12px">
            <label for="candidate-offset">Offset</label>
            <input id="candidate-offset" type="number" value="0" style="width:40px" />
            <label for="candidate-limit">Limit</label>
            <input id="candidate-limit" type="number" value="20" style="width:40px" />
            <label for="candidate-count">Count</label>
            <input id="candidate-count" type="number" value="0" style="width:40px" readonly />
          </div>
          <div style="font-size:12px;color:#86868b;margin-top:8px">
            <label for="candidate-min-seeders">Min seeders</label>
            <input id="candidate-min-seeders" type="number" style="width:60px" />
            <label for="candidate-min-leechers">Min leechers</label>
            <input id="candidate-min-leechers" type="number" style="width:60px" />
            <label for="candidate-season">Season</label>
            <input id="candidate-season" type="number" style="width:60px" />
            <label for="candidate-season-field">Season field</label>
            <select id="candidate-season-field"><option value="all">All</option></select>
            <label for="candidate-sort">Sort</label>
            <select id="candidate-sort"><option value="seeders">Seeders</option></select>
          </div>
        </div>
      </div>
    </div>

    <script src="/app.js?v=3" defer></script>
  </body>
</html>
