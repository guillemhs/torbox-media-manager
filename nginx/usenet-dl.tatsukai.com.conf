# USENET Temp Download - Open DNS for TorBox Web Download
# ============================================================================
# Deploy this on your reverse proxy host: 192.168.1.2
#
# 1. Copy this file: sudo cp nginx/usenet-dl.tatsukai.com.conf /etc/nginx/sites-available/
# 2. Enable it:    sudo ln -s /etc/nginx/sites-available/usenet-dl.tatsukai.com.conf /etc/nginx/sites-enabled/
# 3. Test:         sudo nginx -t
# 4. Reload:       sudo systemctl reload nginx
#
# DNS: usenet-dl.tatsukai.com → 192.168.1.2 (or your public IP)
# Port forward: 80/443 → 192.168.1.2
#
# CRITICAL: NO SSO / NO AUTH — TorBox cloud must reach temp download URLs
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name usenet-dl.tatsukai.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name usenet-dl.tatsukai.com;

    # SSL certificates - obtain via Let's Encrypt:
    #   sudo certbot --nginx -d usenet-dl.tatsukai.com
    ssl_certificate /etc/letsencrypt/live/usenet-dl.tatsukai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usenet-dl.tatsukai.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/usenet-dl.tatsukai.com/chain.pem;

    # SSL security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # ========================================================================
    # IMPORTANT: NO SSO / NO AUTH on this server block
    # TorBox cloud servers must reach temp download URLs without authentication
    # Do NOT add authentik, Authelia, OAuth2_proxy, or any SSO here
    # ========================================================================

    # Proxy to TorBox Media Manager at 192.168.1.5:8066
    location / {
        proxy_pass http://192.168.1.5:8066;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for large file downloads (TorBox pulling files)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering for streaming large files
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 512k;

        # Disable caching for temp download URLs (they are short-lived)
        proxy_cache off;
        add_header Cache-Control "private, no-store" always;
    }

    # Health check endpoint (no auth, for monitoring)
    location /health {
        proxy_pass http://192.168.1.5:8066;
        proxy_set_header Host $host;
        access_log off;
    }
}
