<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TorBox Media Manager</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css?v=__CACHE_VERSION__">
    <style>
      :root{font-family:"Inter",system-ui,-apple-system,sans-serif;body{margin:0;min-height:100vh;background:#f8f9fa;color:#212529}}
      .view{display:none} .view.active{display:block} .hidden{display:none}
      #app-sidebar{position:fixed;top:0;left:0;width:280px;height:100vh;background:#fff;border-right:1px solid #dee2e6;transform:translateX(-100%);transition:transform .2s;z-index:1050;padding:1.5rem}
      #app-sidebar.open{transform:translateX(0)}
      #sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:1040}
      #sidebar-overlay.visible{opacity:1;pointer-events:auto}
      body.sidebar-open{overflow:hidden}
      .nav-link{display:block;padding:.75rem 1rem;color:#212529;text-decoration:none;border-radius:.5rem;margin-bottom:.25rem}
      .nav-link.active{background:#f8f9fa;color:#0d6efd;font-weight:500}
      .nav-link:hover{background:#f1f3f5}
      .navbar .nav-link{color:rgba(255,255,255,0.85)}
      .navbar .nav-link:hover{color:#fff;background:rgba(255,255,255,0.1)}
      .navbar .nav-link.active{color:#fff;background:rgba(255,255,255,0.2)}
      #hamburger-menu{display:none;position:fixed;top:.75rem;left:.75rem;z-index:1060;background:#fff;border:1px solid #dee2e6;border-radius:.5rem;padding:.5rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
      @media (max-width:760px){#hamburger-menu{display:block}}
      #root{padding-top:70px;padding-bottom:2rem}
      .page-title{font-size:1.5rem;font-weight:700;margin-bottom:1rem}
      .section{margin-bottom:2rem}
      .section-title{font-size:1.25rem;font-weight:600;margin-bottom:.75rem}
      .toolbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem}
      .results{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem}
      .empty-state{padding:3rem;text-align:center;color:#6c757d;background:#fff;border:1px solid #dee2e6;border-radius:.5rem}
      .empty-state .btn{margin-top:1rem}
      .spinner{display:inline-block;width:1.5rem;height:1.5rem;border:2px solid #dee2e6;border-top-color:#0d6efd;border-radius:50%;animation:spin .8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .skeleton{background:#e9ecef;border-radius:.375rem;animation:pulse 1.5s infinite}
      @keyframes pulse{0%,100%{opacity:.6}50%{opacity:.3}}
      .muted{color:#6c757d;font-size:.875rem}
      label{font-size:.875rem;color:#6c757d;margin-right:.5rem}
      .detail-layout{display:flex;gap:2rem;margin-bottom:1.5rem}
      .detail-poster{flex:0 0 auto}
      .detail-poster img{max-width:200px;border-radius:.5rem;box-shadow:0 4px 12px rgba(0,0,0,.15)}
      .detail-copy{flex:1}
      .detail-kicker{font-size:.875rem;text-transform:uppercase;letter-spacing:.05em;color:#6c757d;margin-bottom:.25rem}
      .detail-subtitle{color:#6c757d;font-size:.95rem;margin-bottom:.75rem}
      .detail-tag{display:inline-block;padding:.25rem .5rem;background:#e9ecef;border-radius:.375rem;font-size:.8rem;margin-right:.375rem;margin-bottom:.375rem}
      .detail-actions{margin-top:1rem}
      .detail-description{line-height:1.6;color:#495057}
      .detail-error{padding:2rem;text-align:center;color:#dc3545}
      .tab-row{display:flex;gap:.25rem;margin-bottom:.75rem}
      .status-line{font-size:.875rem;color:#6c757d;margin-bottom:.75rem}
      .torrent-list-row{border:1px solid #dee2e6;border-radius:.5rem;padding:.5rem .75rem;margin-bottom:.4rem;background:#fff;display:flex;align-items:center;gap:.5rem;font-size:.875rem}
      .torrent-perm{color:#6c757d;font-size:.8rem;width:2rem;flex:none}
      .torrent-name{font-weight:600;color:#212529;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .torrent-meta{font-size:.8rem;color:#6c757d;flex:none}
      .torrent-actions{flex:none;display:flex;gap:.25rem}
      .source-tag{font-size:.8rem;background:#e9ecef;padding:.125rem .5rem;border-radius:.375rem;color:#495057}
      .category-tag{font-size:.75rem;background:#0d6efd;color:#fff;padding:.125rem .5rem;border-radius:.375rem;text-transform:uppercase}
      .result-row{border:1px solid #dee2e6;border-radius:.5rem;padding:1rem;margin-bottom:.75rem;background:#fff;display:flex;justify-content:space-between;align-items:center}
      .result-row-link{text-decoration:none;color:inherit;flex:1}
      .result-row-link:hover{color:#0d6efd}
      .result-row-title{font-weight:600;color:#212529}
      .result-row-meta{font-size:.875rem;color:#6c757d}
      .result-row-meta-line{font-size:.8rem;color:#6c757d;margin-bottom:.25rem}
      .result-row-source{font-size:.75rem}
      .result-row-arrow{color:#adb5bd;font-size:1.25rem}
      .library-item{border:1px solid #dee2e6;border-radius:.5rem;padding:1rem;margin-bottom:.75rem;background:#fff}
      .library-item-main{flex:1}
      .library-item-title{font-weight:600;color:#212529}
      .library-item-meta{font-size:.875rem;color:#6c757d}
      .library-state{font-weight:500}
      .library-files{border-top:1px solid #dee2e6;margin-top:.75rem;padding-top:.75rem}
      .track-list{font-size:.875rem}
      .track-row{display:flex;justify-content:space-between;padding:.25rem 0;border-bottom:1px solid #f8f9fa}
      .album-cover{width:100%;max-width:200px;border-radius:.5rem;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.15)}
      .album-cover img{width:100%;height:auto;display:block}
      .album-info{flex:1}
      .album-details{margin-top:.5rem}
      .episode-card{border:1px solid #dee2e6;border-radius:.5rem;overflow:hidden;background:#fff;margin-bottom:1rem}
      .episode-card img{width:100%;height:120px;object-fit:cover}
      .episode-copy{padding:1rem}
      .episode-name{font-weight:600;color:#212529}
      .episode-time{font-size:.875rem;color:#0d6efd;font-weight:600}
      .episode-meta{font-size:.8rem;color:#6c757d;margin-top:.25rem}
      .episode-summary{font-size:.875rem;color:#495057;margin-top:.5rem}
      .pagination-btn{padding:.375rem .75rem;font-size:.875rem}
      .pagination-info{font-size:.875rem;color:#6c757d}
      .pagination-ellipsis{padding:.375rem .5rem;color:#6c757d}
      .result-list-item{border:1px solid #dee2e6;border-radius:.5rem;margin-bottom:.75rem;background:#fff;overflow:hidden}
      .result-list-item a{text-decoration:none;color:inherit;display:block;width:100%;height:100%}
      .result-list-item a:hover{background:#f8f9fa}
      .result-list-title{font-weight:600;color:#212529;font-size:1.1rem;margin-bottom:.25rem;word-break:break-word}
      .result-list-meta{font-size:.85rem;color:#495057;margin-bottom:.15rem}
      .result-list-meta-line{font-size:.8rem;color:#6c757d;margin-bottom:.2rem}
      .result-list-source{font-size:.75rem;color:#6c757d;margin-bottom:.2rem}
      .result-list-actions{margin-top:.5rem;display:flex;gap:.35rem;flex-wrap:wrap;justify-content:flex-end}
      .result-list-header{margin-bottom:.2rem}
      .result-list-year-type{font-size:.85rem;color:#6c757d;margin-bottom:.15rem}
      .search-result-item{border:1px solid #dee2e6;border-radius:.5rem;margin-bottom:.75rem;background:#fff;overflow:hidden}
      .search-result-item a{text-decoration:none;color:inherit;display:block;width:100%;height:100%}
      .search-result-item a:hover{background:#f8f9fa}
      .search-result-header{margin-bottom:.2rem}
      .search-result-title{font-weight:600;color:#212529;font-size:1.1rem;margin-bottom:.25rem;word-break:break-word}
      .search-result-year-type{font-size:.85rem;color:#6c757d;margin-bottom:.15rem}
      .search-result-meta{font-size:.85rem;color:#495057;margin-bottom:.15rem}
      .search-result-source{font-size:.75rem;color:#6c757d;margin-bottom:.2rem}
      .search-result-actions{margin-top:.5rem;display:flex;gap:.35rem;flex-wrap:wrap;justify-content:flex-end}
      .search-result-actions .btn{font-size:.85rem;padding:.35rem .6rem}
      .result-list-link{display:block;padding:.75rem 1rem;text-decoration:none;color:inherit}
      .result-list-link:hover{background:#f8f9fa;color:#0d6efd}
      .result-list-actions .btn{font-size:.85rem;padding:.35rem .6rem}
      .pagination{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;justify-content:flex-end;margin-top:.5rem}
      .pagination .btn{font-size:.875rem}
      .pagination .pagination-btn.active{background:#0d6efd;border-color:#0d6efd;color:#fff}
      .card{transition:transform .2s,box-shadow .2s}
      .card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
      .card-img-top{height:200px;object-fit:cover}
      .search-card{border:none;box-shadow:0 2px 8px rgba(0,0,0,.08)}
      .search-card .card-body{padding:1.5rem}
      .sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;border-bottom:1px solid #dee2e6;margin-bottom:1rem}
      .sidebar-title{margin:0;font-size:1.25rem;font-weight:600}
      .sidebar-body{padding:1rem 1.5rem}
      .btn-close{background:none;border:none;font-size:1.5rem;line-height:1;color:#6c757d;padding:0.5rem;cursor:pointer}
      .btn-close:hover{color:#000}
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container-fluid">
        <button class="btn btn-outline-light" id="hamburger-menu" aria-label="Toggle navigation">&#9776;</button>
        <a class="navbar-brand d-flex align-items-center" href="/">
          <span class="fas fa-film me-2" style="font-size:1.25rem"></span>TorBox Media Manager
        </a>
        <div class="d-none d-md-flex">
          <a href="/browse" class="nav-link px-3" data-view="browse">Browse</a>
          <a href="/movies" class="nav-link px-3" data-view="movies">Movies</a>
          <a href="/shows" class="nav-link px-3" data-view="shows">Shows</a>
          <a href="/music" class="nav-link px-3" data-view="music">Music</a>
          <a href="/library" class="nav-link px-3" data-view="library">Library</a>
          <a href="/calendar" class="nav-link px-3" data-view="calendar">Calendar</a>
        </div>
        <div class="d-flex ms-auto">
          <span class="text-light small me-3" id="app-status"></span>
        </div>
      </div>
    </nav>

    <div id="app-sidebar" tabindex="-1">
      <div class="sidebar-header">
        <h5 class="sidebar-title">TorBox</h5>
        <button type="button" class="btn-close text-reset" aria-label="Close"></button>
      </div>
      <div class="sidebar-body">
        <nav class="nav flex-column">
          <a href="/browse" class="nav-link" data-view="browse">Browse</a>
          <a href="/movies" class="nav-link" data-view="movies">Movies</a>
          <a href="/shows" class="nav-link" data-view="shows">Shows</a>
          <a href="/library" class="nav-link" data-view="library">Library</a>
          <a href="/music" class="nav-link" data-view="music">Music</a>
          <a href="/calendar" class="nav-link" data-view="calendar">Calendar</a>
        </nav>
      </div>
    </div>

    <div id="sidebar-overlay" tabindex="-1"></div>

    <div id="root" class="container-fluid">
      <h1 id="page-title" class="page-title">TorBox Media Manager</h1>

      <!-- Browse view -->
      <section id="view-browse" class="view">
        <div class="card search-card mb-4">
          <div class="card-body">
            <div class="toolbar">
              <label for="browse-query" class="visually-hidden">Search</label>
              <input id="browse-query" type="search" class="form-control form-control-lg" placeholder="Search movies, shows, music…" />
              <label class="form-check form-check-inline me-2"><input id="source-indexers" type="checkbox" class="form-check-input" checked /> Indexers</label>
              <label class="form-check form-check-inline me-2"><input id="source-usenet" type="checkbox" class="form-check-input" /> Usenet</label>
              <button id="browse-search-btn" class="btn btn-primary">Search</button>
            </div>
            <div id="browse-status" class="mt-2"></div>
          </div>
        </div>

        <div id="browse-results" class="results"></div>
        <div id="browse-pagination" class="pagination my-3"></div>
        <button id="browse-more" class="btn btn-outline-secondary btn-sm">More</button>
      </section>

      <!-- Movies view -->
      <section id="view-movies" class="view">
        <div class="card search-card mb-4">
          <div class="card-body">
            <div class="toolbar">
              <label for="movies-query" class="visually-hidden">Search</label>
              <input id="movies-query" type="search" class="form-control form-control-lg" placeholder="Search movies…" />
              <label class="form-check form-check-inline me-2"><input id="movies-source-indexers" type="checkbox" class="form-check-input" checked /> Indexers</label>
              <label class="form-check form-check-inline me-2"><input id="movies-source-usenet" type="checkbox" class="form-check-input" /> Usenet</label>
              <button id="movies-search-btn" class="btn btn-primary">Search</button>
              <button id="movies-discover-btn" class="btn btn-outline-secondary">Discover</button>
            </div>
            <div id="movies-status" class="mt-2"></div>
            <div id="movies-count" class="text-muted small mt-2"></div>
          </div>
        </div>
        <div id="movies-results" class="results"></div>
        <div id="movies-pagination" class="pagination my-3"></div>
        <button id="movies-more" class="btn btn-outline-secondary btn-sm">More</button>
      </section>

      <!-- Shows view -->
      <section id="view-shows" class="view">
        <div class="card search-card mb-4">
          <div class="card-body">
            <div class="toolbar">
              <label for="shows-query" class="visually-hidden">Search</label>
              <input id="shows-query" type="search" class="form-control form-control-lg" placeholder="Search shows…" />
              <label class="form-check form-check-inline me-2"><input id="shows-source-indexers" type="checkbox" class="form-check-input" checked /> Indexers</label>
              <label class="form-check form-check-inline me-2"><input id="shows-source-usenet" type="checkbox" class="form-check-input" /> Usenet</label>
              <button id="shows-search-btn" class="btn btn-primary">Search</button>
              <button id="shows-discover-btn" class="btn btn-outline-secondary">Discover</button>
            </div>
            <div id="shows-status" class="mt-2"></div>
            <div id="shows-count" class="text-muted small mt-2"></div>
          </div>
        </div>
        <div id="shows-results" class="results"></div>
        <div id="shows-pagination" class="pagination my-3"></div>
        <button id="shows-more" class="btn btn-outline-secondary btn-sm">More</button>
      </section>

      <!-- Torrents view -->
      <section id="view-library" class="view">
        <div class="card search-card mb-4">
          <div class="card-body">
            <div class="toolbar">
              <label for="library-query" class="visually-hidden">Search library</label>
              <input id="library-query" type="search" class="form-control form-control-lg" placeholder="Search library…" />
              <label for="library-sort" class="form-label-sm">Sort by</label>
              <select id="library-sort" class="form-select form-select-sm"><option value="created">Added</option><option value="name">Name</option><option value="size">Size</option><option value="status">Status</option></select>
              <label for="library-filter" class="form-label-sm">Filter by</label>
              <select id="library-filter" class="form-select form-select-sm"><option value="all">All</option><option value="video">Video</option><option value="music">Music</option><option value="other">Other</option></select>
            </div>
            <div id="library-summary" class="text-muted small mt-2"></div>
          </div>
        </div>
        <div id="library-results" class="results"></div>
      </section>

      <!-- Music view -->
      <section id="view-music" class="view">
        <div class="card search-card mb-4">
          <div class="card-body">
            <div class="toolbar">
              <label for="music-query" class="visually-hidden">Search</label>
              <input id="music-query" type="search" class="form-control form-control-lg" placeholder="Search music…" />
              <label class="form-check form-check-inline me-2"><input id="music-source-indexers" type="checkbox" class="form-check-input" checked /> Indexers</label>
              <label class="form-check form-check-inline me-2"><input id="music-source-usenet" type="checkbox" class="form-check-input" /> Usenet</label>
              <button id="music-search-btn" class="btn btn-primary">Search</button>
              <button id="music-discover-btn" class="btn btn-outline-secondary">Discover</button>
            </div>
            <div id="music-status" class="mt-2"></div>
            <div id="music-count" class="text-muted small mt-2"></div>
          </div>
        </div>
        <div id="music-results" class="results"></div>
        <div id="music-pagination" class="pagination my-3"></div>
        <button id="music-more" class="btn btn-outline-secondary btn-sm">More</button>
      </section>

      <!-- Calendar view -->
      <section id="view-calendar" class="view">
        <div class="card search-card mb-4">
          <div class="card-body">
            <div class="toolbar">
              <label for="calendar-date" class="form-label-sm">Date</label>
              <input id="calendar-date" type="date" class="form-control form-control-sm" />
              <label for="calendar-country" class="form-label-sm">Country</label>
              <select id="calendar-country" class="form-select form-select-sm"><option value="US">US</option></select>
              <label for="calendar-source" class="form-label-sm">Source</label>
              <select id="calendar-source" class="form-select form-select-sm"><option value="all">All</option></select>
              <label for="calendar-query" class="visually-hidden">Search</label>
              <input id="calendar-query" type="search" class="form-control form-control-sm" placeholder="Search…" />
              <label for="calendar-platform" class="form-label-sm">Platform</label>
              <select id="calendar-platform" class="form-select form-select-sm"><option value="all">All</option></select>
            </div>
            <div id="calendar-summary" class="text-muted small mt-2"></div>
          </div>
        </div>
        <div id="calendar-results" class="results"></div>
      </section>

      <!-- Title view -->
      <section id="view-title" class="view">
        <div id="detail-content"></div>
        <div id="title-search-status"></div>
        <div id="title-search-results"></div>
        <div id="title-torrent-search-title"></div>
        <div id="title-torrent-count"></div>
        <div id="title-torrent-results" class="results"></div>
        <button id="title-torrent-more" class="btn btn-outline-secondary btn-sm">More</button>
        <div id="title-usenet-search-title"></div>
        <div id="title-usenet-search-count"></div>
        <div id="title-usenet-search-results" class="results"></div>
        <label for="title-usenet-search-source" class="form-label-sm">Source</label>
        <select id="title-usenet-search-source" class="form-select form-select-sm"><option value="all">All</option></select>
        <button id="title-usenet-search-more" class="btn btn-outline-secondary btn-sm">More</button>
      </section>

      <!-- Usenet search -->
      <section id="usenet-search" class="section hidden">
        <div class="card search-card mb-4">
          <div class="card-body">
            <div class="toolbar">
              <label for="usenet-query" class="visually-hidden">Search</label>
              <input id="usenet-query" type="search" class="form-control form-control-lg" placeholder="Search Usenet…" />
              <label for="usenet-search-source" class="form-label-sm">Source</label>
              <select id="usenet-search-source" class="form-select form-select-sm"><option value="all">All</option></select>
            </div>
            <div id="usenet-status" class="mt-2"></div>
          </div>
        </div>
        <div id="usenet-results" class="results"></div>
        <label class="form-check form-check-inline me-2"><input id="usenet-cached-only" type="checkbox" class="form-check-input" /> Cached only</label>
        <div class="mt-2">
          <label for="usenet-offset" class="form-label-sm">Offset</label>
          <input id="usenet-offset" type="number" class="form-control form-control-sm" value="0" style="width:4rem" />
          <label for="usenet-limit" class="form-label-sm">Limit</label>
          <input id="usenet-limit" type="number" class="form-control form-control-sm" value="20" style="width:4rem" />
        </div>
      </section>

      <!-- Torrents/Usenet search -->
      <section id="torrents-usenet-search" class="section hidden">
        <div id="torrents-usenet-search-title"></div>
        <div id="torrents-usenet-search-count"></div>
        <div id="torrents-usenet-search-results" class="results"></div>
        <label for="torrents-usenet-search-source" class="form-label-sm">Source</label>
        <select id="torrents-usenet-search-source" class="form-select form-select-sm"><option value="all">All</option></select>
        <button id="torrents-usenet-search-more" class="btn btn-outline-secondary btn-sm">More</button>
      </section>

      <!-- Music release -->
      <section id="music-release" class="section hidden">
        <div id="music-release-status"></div>
        <div id="music-release-results" class="results"></div>
      </section>

      <!-- Candidate modal -->
      <div class="modal fade" id="candidate-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="candidate-title"></h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div id="candidate-results"></div>
              <div id="candidate-status" class="text-muted small"></div>
              <div class="mt-3">
                <label for="candidate-offset" class="form-label-sm">Offset</label>
                <input id="candidate-offset" type="number" class="form-control form-control-sm" value="0" style="width:4rem" />
                <label for="candidate-limit" class="form-label-sm">Limit</label>
                <input id="candidate-limit" type="number" class="form-control form-control-sm" value="20" style="width:4rem" />
                <label for="candidate-count" class="form-label-sm">Count</label>
