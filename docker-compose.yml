# docker-compose.yml
services:
  app:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "6666:6666"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:change-me@db:5432/torbox_mediamanager}
      LOCAL_MEDIA_PATH: ${LOCAL_MEDIA_PATH:-/data/media}
      IMDB_DATA_PATH: ${IMDB_DATA_PATH:-/app/data/imdb}
      IMDB_AUTO_IMPORT: ${IMDB_AUTO_IMPORT:-true}
      TVMAZE_SYNC_INTERVAL: ${TVMAZE_SYNC_INTERVAL:-24h}
      TORBOX_API_KEY: ${TORBOX_API_KEY:-}
      TMDB_API_READ_ACCESS_TOKEN: ${TMDB_API_READ_ACCESS_TOKEN:-}
      TORRENT_SEARCH_BASE_URL: ${TORRENT_SEARCH_BASE_URL:-https://torrentio.strem.fun}
      TORZNAB_URL: ${TORZNAB_URL:-http://prowlarr:9696/1/api}
      TORZNAB_API_KEY: ${TORZNAB_API_KEY:-}
      TORZNAB_MUSIC_CATEGORY: ${TORZNAB_MUSIC_CATEGORY:-3000}
    depends_on:
      db:
        condition: service_healthy
      prowlarr:
        condition: service_started
    volumes:
      - ${HOST_MEDIA_PATH:-./media}:/data/media:ro
      - ./data:/app/data:rw
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6666/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15-alpine
    init: true
    restart: unless-stopped
    stop_grace_period: 1m
    volumes:
      - ${POSTGRES_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-torbox_mediamanager}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.7.0
    restart: unless-stopped
    depends_on:
      flaresolverr:
        condition: service_started
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Madrid}
    ports:
      - "9696:9696"
    volumes:
      - ${PROWLARR_CONFIG_PATH:-./data/prowlarr}:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: ${TZ:-Europe/Madrid}
    # Keep port 8191 internal to the Compose network; Prowlarr reaches it by service name.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
